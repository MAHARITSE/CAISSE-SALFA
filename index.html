      (function() {
        try {
          var originalFetch = window.fetch;
          var currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(fn) {
              currentFetch = fn;
            },
            configurable: true,
            enumerable: true,
          });
        } catch (e) {
          try {
            var proto = Object.getPrototypeOf(window);
            if (proto) {
              var curProtoFetch = proto.fetch || window.fetch;
              Object.defineProperty(proto, 'fetch', {
                get: function() { return curProtoFetch; },
                set: function(v) { curProtoFetch = v; },
                configurable: true,
                enumerable: true,
              });
            }
          } catch (_) {}
        }
      })();
    </script>
