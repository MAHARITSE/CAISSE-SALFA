; CAISSE SALFA — limites PHP pour l'import d'une sauvegarde complète.
; Appliqué par Apache lorsque PHP tourne en module (WampServer).
post_max_size = 32M
upload_max_filesize = 32M
memory_limit = 256M
max_execution_time = 120
; Filet de sécurité du ramasse-miettes PHP ; la fenêtre d’inactivité est
; réglée par `duree_session` dans l’API (30 minutes par défaut).
session.gc_maxlifetime = 3600
